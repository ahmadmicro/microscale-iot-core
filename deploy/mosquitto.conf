# Dev config — anonymous access + two listeners (TCP + WebSocket).
# DO NOT ship this to production. Production = EMQX with JWT + per-topic ACLs
# (a client token may read ms/<their-site>/# and write only its /cmd topics).

persistence true
persistence_location /mosquitto/data/

# MQTT over TCP (adapters / edge)
listener 1883
protocol mqtt
allow_anonymous true

# MQTT over WebSocket (browser dashboard). mqtt.js connects to ws://host:9001/mqtt
listener 9001
protocol websockets
allow_anonymous true
